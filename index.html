<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-shop Rohlik.cz</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <main>
        <div class="karty">
            <article class="card__produkt">

                <header class="picture">
                    <a>
                        <img src="./pictures/Okurka1.png" alt="Okurka hadovka">
                    </a>
                </header>

                <a class="cena__top">
                    <div class="cena">
                        <span class="cena__semibold">34</span>
                        <sup class="cena__sup">90</sup>
                        <span>Kč</span>
                    </div>

                    <span class="info">
                        Okurka hadovka 
                        (cca 300 g)
                    </span>
                </a>

                <footer class="cena__bottom">
                    <span>1 ks</span>
                    <span>34.9 Kč/ks</span>
                </footer>

            </article>

            <article class="card__produkt card__produkt--tag">
                
                <header class="picture">
                    <a>
                        <img src="./pictures/Kureci1.png" alt="Kuřecí prsní řízky">
                    </a>
                </header>

                <a class="cena__top">
                    <div class="cena">
                        <span class="cca__semibold">cca</span>
                        <span class="cena__semibold">100</span>
                        <sup class="cena__sup">76</sup>
                        <span>Kč</span>
                    </div>

                    <span class="info">
                        Kuřecí prsní řízky
                        od českého výrobce
                    </span>
                </a>

                <footer class="cena__bottom">
                    <span>cca 420 g</span>
                    <span>239.9 Kč/kg</span>
                </footer>

            </article>

            <article class="card__produkt">
                
                <header class="picture">
                    <a>
                        <img src="./pictures/Banan1.png" alt="Banán">
                    </a>
                </header>

                <a class="cena__top">
                    <div class="cena">
                        <span class="cca__semibold">cca</span>
                        <span class="cena__semibold">8</span>
                        <sup class="cena__sup">49</sup>
                        <span>Kč</span>
                    </div>

                    <span class="info">
                        Banán 1 ks
                    </span>
                </a>

                <footer class="cena__bottom">
                    <span>cca 190 g</span>
                    <span>45.9 Kč/kg</span>
                </footer>

            </article>
        </div>
    </main>
</body>
</html>
